# database init, supports mysql too
database=hsqldb
# MIGRATED: Renamed from spring.datasource.schema (deprecated in Spring Boot 2.5+, replaced by spring.sql.init.*)
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
# MIGRATED: Renamed from spring.datasource.data (deprecated in Spring Boot 2.5+, replaced by spring.sql.init.*)
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
# MIGRATED: Added to ensure SQL init scripts run after JPA EntityManagerFactory is created (required in Spring Boot 2.5+)
spring.jpa.defer-datasource-initialization=true

# Internationalization
spring.messages.basename=messages/messages

# Actuator / Management
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
# MIGRATED: Renamed from spring.resources.cache.cachecontrol.max-age (deprecated in Spring Boot 2.5+)
spring.web.resources.cache.cachecontrol.max-age=12h
