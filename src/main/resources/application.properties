# database init, supports mysql too
database=hsqldb
# MIGRATED: spring.datasource.schema renamed to spring.sql.init.schema-locations (deprecated in Spring Boot 2.5+)
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
# MIGRATED: spring.datasource.data renamed to spring.sql.init.data-locations (deprecated in Spring Boot 2.5+)
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none

# Internationalization
spring.messages.basename=messages/messages

# Actuator / Management
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
# MIGRATED: spring.resources.cache.cachecontrol.max-age renamed to spring.web.resources.cache.cachecontrol.max-age (deprecated in Spring Boot 2.6+)
spring.web.resources.cache.cachecontrol.max-age=12h
