# database init, supports mysql too
database=hsqldb
# MIGRATED: Renamed from spring.datasource.schema (deprecated in Spring Boot 2.5+)
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
# MIGRATED: Renamed from spring.datasource.data (deprecated in Spring Boot 2.5+)
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
# MIGRATED: Required in Spring Boot 2.5+ to initialize datasource (run SQL scripts) after Hibernate setup
spring.jpa.defer-datasource-initialization=true

# Internationalization
spring.messages.basename=messages/messages

# Actuator / Management
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
# MIGRATED: Renamed from spring.resources.cache.cachecontrol.max-age (deprecated in Spring Boot 2.5)
spring.web.resources.cache.cachecontrol.max-age=12h
